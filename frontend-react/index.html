<!doctype html>
<!-- Documento HTML principal de la aplicación React del SGA -->
<html lang="es">
  <head>
    <!-- Define la codificación de caracteres UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Configura el ícono de la pestaña del navegador -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Adapta la escala de la vista a pantallas de escritorio y dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título mostrado en la pestaña del navegador -->
    <title>SGA - Sistema de Gestión Académica</title>
  </head>
  <body>
    <!-- Contenedor raíz donde React monta toda la aplicación -->
    <div id="root"></div>
    <!-- Punto de entrada principal procesado por Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
